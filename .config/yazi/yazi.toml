[mgr]
show_hidden = true

[preview]
wrap = "yes"
tab_size = 2
max_width  = 1920
max_height = 1080

[opener]
edit = [
  { run = 'nvim -O"$n" "$@"', desc = "Edit", block = true },
  { run = 'nvim -d "$@"',     desc = "Diff", block = true },
]

wine = [
  { run = 'wine "$@"', desc = "Wine", orphan = true },
]

java = [
  { run = 'java -jar "$@"', desc = "Launch jar", orphan = true },
]

[open]
prepend_rules = [
  { url = "*.exe",  use = "wine" },
  { url = "*.jar",  use = "java" },
]
